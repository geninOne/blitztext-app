name: macOS Build & Release

# Builds a universal (Apple Silicon + Intel) macOS app.
# - On pushes to main: build, verify, and publish a rolling prerelease.
# - On a version tag (v*): publish a GitHub Release with the app attached.
# - On a pull request: only when the PR carries the label `build-artifacts`.
#   Die schnelle Kompilierpruefung fuer PRs macht ci.yml; ein universal
#   Release-Build gehoert dort nicht in jeden Push. Wer ein herunterladbares
#   Test-Build am PR braucht, setzt das Label (oder startet den Workflow per
#   "Run workflow" auf dem Branch).
#
# Note: this is a native macOS app (SwiftUI/AppKit, CoreML/WhisperKit, Keychain,
# Accessibility). There is no Windows build target; a Windows version would be a
# separate, cross-platform implementation.

on:
  pull_request:
    # `labeled` ist noetig, damit das Setzen des Labels den Lauf ausloest;
    # die Standard-Typen enthalten es nicht.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'BlitztextMac/**'
      - 'BlitztextShared/**'
      - 'build.sh'
      - 'shared/**'
      - '.github/workflows/macos-release.yml'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build universal macOS app
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-artifacts')
    # Die App braucht ein aktuelles Xcode (MLX, Sparkle, neue SwiftUI-APIs).
    runs-on: macos-26
    permissions:
      contents: write   # required to publish a Release on tag pushes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build universal app (Release, ad-hoc signed)
        run: bash ./build.sh --release

      - name: Package app as zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent Blitztext.app Blitztext-macos-universal.zip
          ls -lh Blitztext-macos-universal.zip

      # Sparkle-Appcast. Nur auf einem Versionstag: der Feed der App zeigt auf
      # releases/latest/download/appcast.xml, und "latest" ist bei GitHub immer
      # ein richtiges Release, nie ein Prerelease von main.
      - name: Create signed appcast (Sparkle)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: "2.8.1"
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_PRIVATE_KEY fehlt. Ohne Signatur lehnt jede Installation dieses Update ab."
            exit 1
          fi

          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle
          tar -xJf sparkle.tar.xz -C sparkle

          # sign_update liefert die fertigen Attribute, zum Beispiel
          # sparkle:edSignature="..." length="12345"
          SIGNATURE_LINE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | ./sparkle/bin/sign_update Blitztext-macos-universal.zip --ed-key-file -)"
          if [ -z "$SIGNATURE_LINE" ]; then
            echo "::error::sign_update hat keine Signatur geliefert."
            exit 1
          fi

          SHORT_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([0-9]*\)"\{0,1\} *$/\1/p' BlitztextMac/project.yml | head -1)"
          MIN_SYSTEM="$(sed -n 's/^ *MACOSX_DEPLOYMENT_TARGET: *"\{0,1\}\([0-9.]*\)"\{0,1\} *$/\1/p' BlitztextMac/project.yml | head -1)"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Blitztext-macos-universal.zip"

          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Blitztext</title>
              <item>
                <title>Blitztext ${SHORT_VERSION}</title>
                <pubDate>$(date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>${BUILD_VERSION}</sparkle:version>
                <sparkle:shortVersionString>${SHORT_VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>${MIN_SYSTEM}</sparkle:minimumSystemVersion>
                <enclosure url="${DOWNLOAD_URL}" type="application/octet-stream" ${SIGNATURE_LINE} />
              </item>
            </channel>
          </rss>
          XML
          cat appcast.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blitztext-macos-universal
          path: Blitztext-macos-universal.zip
          if-no-files-found: error

      # Push to main: publish a rolling prerelease so there is always a current
      # downloadable build. The tag is created here by GITHUB_TOKEN, which on
      # purpose does NOT re-trigger this workflow, so we build and release in
      # one job rather than relying on a tag-triggered run.
      # One combined prerelease per commit: the tag is derived from the SHA so
      # the macOS and Windows jobs target the SAME release. Whichever job runs
      # first creates it; the other just uploads its asset.
      - name: Publish prerelease (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="main-${GITHUB_SHA:0:7}"
          # main-Builds sind Prereleases und werden nie ueber Sparkle verteilt;
          # deshalb liegt hier nur das Archiv, kein appcast.xml.
          ASSETS=(Blitztext-macos-universal.zip)
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "Blitztext main build (${GITHUB_SHA:0:7})" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automatic build from main (commit ${GITHUB_SHA:0:7}). macOS: universal (Apple Silicon + Intel), ad-hoc signed (not notarized) — first launch: right-click → Open, or run: xattr -dr com.apple.quarantine /Applications/Blitztext.app. Windows: unsigned NSIS/MSI — SmartScreen may warn on first launch." \
          || gh release upload "$TAG" "${ASSETS[@]}" --clobber

      # Manual version tag (e.g. v1.0.0): publish a full, official release.
      - name: Publish release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows job may publish the same tag's release first, so fall
          # back to uploading into the existing release.
          # appcast.xml gehoert zwingend dazu: die installierten Apps lesen es
          # unter releases/latest/download/appcast.xml.
          ASSETS=(Blitztext-macos-universal.zip appcast.xml)
          gh release create "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            --title "Blitztext $GITHUB_REF_NAME" \
            --notes "Universal macOS build (Apple Silicon + Intel), ad-hoc signed (not notarized). First launch: right-click the app and choose Open, or run: xattr -dr com.apple.quarantine /Applications/Blitztext.app" \
          || gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
